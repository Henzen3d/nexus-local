# Connection header correto para WebSocket (e close para HTTP normal)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Cabeçalhos de segurança (ver comentário no arquivo incluído)
    include /etc/nginx/snippets/security-headers.conf;

    # Não expor a versão do nginx em erros/headers
    server_tokens off;

    # Uploads de anexos (limite alinhado ao backend: 20MB + overhead multipart)
    client_max_body_size 25m;

    # DNS interno do Docker — re-resolve se o container backend reiniciar
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shell do PWA não pode ficar preso no cache do browser nem do Cloudflare.
    location = /sw.js {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/workbox-.*\.js$ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Bundles do Vite têm hash no nome: podem ser cacheados agressivamente.
    location ~* ^/assets/.+\.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # API REST
    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming / respostas longas (enhancer, ranking, etc.)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        client_max_body_size 25m;
    }

    # Anexos (thumbnails / download) — servidos pelo backend via URL assinada
    # (HMAC + expiração). São dados privados de cada usuário: NUNCA "public"
    # (o Cloudflare cachearia e serviria para qualquer um com a URL).
    location /attachments/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # O backend já envia Cache-Control: private + nosniff; só garantimos
        # que nada aqui sobrescreva para público.
        proxy_hide_header Expires;
    }

    # Health check (útil para Cloudflare / debug no servidor)
    location = /health {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # WebSocket do chat — crítico atrás de Cloudflare Tunnel
    location /ws/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;

        # Upgrade obrigatório para WS
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Não bufferizar frames WS
        proxy_buffering off;
        proxy_cache off;

        # Sessões longas (Cloudflare Tunnel + chat streaming)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Evita 1006 por fechamento prematuro em alguns proxies
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
    }
}
