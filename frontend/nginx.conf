# Connection header correto para WebSocket (e close para HTTP normal)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Uploads de anexos (limite alinhado ao backend: 20MB + overhead multipart)
    client_max_body_size 25m;

    # DNS interno do Docker — re-resolve se o container backend reiniciar
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API REST
    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming / respostas longas (enhancer, ranking, etc.)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        client_max_body_size 25m;
    }

    # Arquivos estáticos de anexos (thumbnails / download)
    location /attachments/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Health check (útil para Cloudflare / debug no servidor)
    location = /health {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # WebSocket do chat — crítico atrás de Cloudflare Tunnel
    location /ws/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;

        # Upgrade obrigatório para WS
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Não bufferizar frames WS
        proxy_buffering off;
        proxy_cache off;

        # Sessões longas (Cloudflare Tunnel + chat streaming)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Evita 1006 por fechamento prematuro em alguns proxies
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
    }
}
