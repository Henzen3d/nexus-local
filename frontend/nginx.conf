server {
    listen 80;
    server_name localhost;

    # Usa o DNS interno do Docker para resolver nomes de containers dinamicamente
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Redireciona rotas não encontradas para o index.html (Vital para React Router/Vite)
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Variável força re-resolução DNS a cada request (evita 502 se o backend reiniciar)
        set $upstream_api http://backend:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $upstream_ws http://backend:8000;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}