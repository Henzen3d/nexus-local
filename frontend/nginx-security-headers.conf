# Cabeçalhos de segurança compartilhados.
# IMPORTANTE: no nginx, qualquer `add_header` dentro de um `location` descarta
# os herdados do `server`. Por isso este arquivo é incluído em TODOS os blocos
# que definem seus próprios add_header (sw.js, workbox, /, /attachments/).
#
# Não há CSP completa de propósito: os artefatos (ArtifactPanel/SandboxCard)
# rodam em iframes `srcdoc`, que HERDAM a CSP do documento pai — uma política
# `script-src 'self'` quebraria os CDNs (React/Tailwind) usados pelos artefatos.
# A proteção contra clickjacking vem de frame-ancestors + X-Frame-Options.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
