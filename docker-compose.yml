services:
  backend:
    build: ./backend
    container_name: nexus_backend
    restart: always
    # Injeta JWT_SECRET, chaves de API e demais vars do .env no container.
    # Sem isso o backend falha no boot (auth.py exige JWT_SECRET) e o proxy
    # devolve 502 em /api/* e /ws/*.
    env_file:
      - .env
    volumes:
      # Espelha o arquivo do banco de dados do Linux para dentro do container
      - ./backend/nexuslocal.db:/app/backend/nexuslocal.db
      - fastembed_cache:/root/.cache/fastembed
    # NÃO declare JWT_SECRET em `environment` com ${JWT_SECRET}:
    # se a var não existir no host, o Compose injeta string vazia e
    # isso SOBRESCREVE o valor vindo do env_file — matando o backend.
    # Todo o .env (JWT_SECRET, API keys, etc.) entra via env_file acima.
    networks:
      - nexus_net

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: nexus_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - nexus_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nexus_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge

volumes:
  fastembed_cache: